name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl wget

      - name: Install libclang
        run: apt-get install -y libclang-dev
        
      - name: Install protobuf-compiler
        run: apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      # The pinned toolchain (with rustfmt and clippy) comes from rust-toolchain.toml.
      - name: Install pinned toolchain
        # (rustup >= 1.28 installs it explicitly; older rustup auto-installs on `rustup show`)
        run: rustup toolchain install || rustup show

      - name: Install dependencies
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Run tests
        run: bash ./dev_support/test.sh